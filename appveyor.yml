image: Visual Studio 2026
configuration: Debug
platform: x64
environment:
  VCPKG_ROOT: C:\Tools\vcpkg
install:
- cd C:\Tools\vcpkg
- git pull
- .\bootstrap-vcpkg.bat
- cd %APPVEYOR_BUILD_FOLDER%
before_build:
  - cmd: >-
      for /f "usebackq tokens=*" %%i in (`%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`)
      do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
      && set CC=
      && set CXX=
      && cmake -B msvc -G Ninja . --preset %PLATFORM%-debug -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
build_script:
  - cmake --build msvc --parallel
cache:
- C:\Tools\vcpkg\packages\
init:
  # Set "build version number" to "short-commit-hash" or when tagged to "tag name" (Travis style)
  - ps: >-
      if ($env:APPVEYOR_REPO_TAG -eq "true")
      {
        Update-AppveyorBuild -Version "$env:APPVEYOR_REPO_TAG_NAME"
      }
      else
      {
        Update-AppveyorBuild -Version "dev-$($env:APPVEYOR_REPO_COMMIT.substring(0,7))"
      }
